<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>نظام إدارة مركز التأهيل والتدخل المبكر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand large"><span>🧩</span><div><strong>مركز التأهيل</strong><small>نظام الإدارة والمتابعة</small></div></div>
      <h1>تسجيل الدخول</h1>
      <p>النموذج يبدأ بدون أي بيانات جاهزة.</p>
      <form id="loginForm">
        <label>البريد الإلكتروني<input id="loginEmail" type="email" required placeholder="admin@example.com"></label>
        <label>كلمة المرور<input id="loginPassword" type="password" required></label>
        <button class="btn primary full">دخول</button>
      </form>
      <div class="hint">اربط النموذج بـ Firebase Authentication قبل الاستخدام الفعلي.</div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span>🧩</span><div><strong>مركز التأهيل</strong><small>لوحة الإدارة</small></div></div>
      <nav id="nav">
        <button data-page="dashboard">الرئيسية</button>
        <button data-page="children">ملفات الأطفال</button>
        <button data-page="attendance">الحضور والانصراف</button>
        <button data-page="plans">الخطط الفردية</button>
        <button data-page="sessions">جلسات التخاطب</button>
        <button data-page="reports">التقارير</button>
        <button data-page="users">المستخدمون والصلاحيات</button>
        <button data-page="settings">الإعدادات</button>
      </nav>
      <button id="logoutBtn" class="logout">تسجيل الخروج</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><h2 id="pageTitle">الرئيسية</h2><span id="roleLabel" class="badge">مستخدم</span></div>
        <div id="userName">—</div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="modal-close">×</button>
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
